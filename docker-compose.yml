version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: todolist_db
    environment:
      POSTGRES_DB: todolist_dev
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
